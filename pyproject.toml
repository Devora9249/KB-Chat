[project]
name = "kc-assistant"
version = "0.1.0"
description = "RAG assistant over the Genpact Cora Knowledge Center"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Each domain owner adds her runtime dependencies with `uv add <pkg>` (stack list only, see CLAUDE.md).
dependencies = [
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kc", "contracts"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["src", "."]
packages = ["kc", "contracts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
