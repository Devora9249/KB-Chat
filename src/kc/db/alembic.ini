# Alembic config for the kc database (owner: Storage & Indexing).
# Run from the repo root:
#   uv run alembic -c src/kc/db/alembic.ini upgrade head         # apply (needs DATABASE_URL)
#   uv run alembic -c src/kc/db/alembic.ini upgrade head --sql   # print SQL only, no DB needed
# The database URL is NOT stored here; env.py reads it from DATABASE_URL via DbSettings.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
